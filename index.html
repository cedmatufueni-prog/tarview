<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Best Buy $1000 Reward</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* High-quality tech retail store interior background optimized for mobile scaling */
            background-image: linear-gradient(rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.8)), 
                              url('https://images.unsplash.com/photo-1531297484001-80022131f5a1?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            -webkit-tap-highlight-color: transparent;
        }

        .header-logo {
            background-color: white;
            width: 100%;
            padding: 14px 0;
            display: flex;
            justify-content: center;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .bestbuy-brand {
            font-weight: 900;
            font-style: italic;
            font-size: 22px;
            letter-spacing: -1.2px;
            display: flex;
            align-items: center;
        }
        .bb-blue { color: #0046be; }
        .bb-tag { 
            background-color: #fff200; 
            padding: 0px 5px; 
            margin-left: 2px;
            color: #0046be;
            border-radius: 2px;
            font-size: 0.85em;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 16px;
        }

        .price-text {
            color: #0046be;
            font-size: 56px;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 4px;
            text-align: center;
        }

        @media (min-width: 640px) {
            .price-text { font-size: 72px; }
        }

        .sub-heading {
            color: #4b5563;
            font-weight: 700;
            letter-spacing: 0.1em;
            font-size: 12px;
            text-transform: uppercase;
        }

        .active-badge {
            background-color: #0046be;
            color: white;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            margin: 16px 0;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .instruction-box {
            background: white;
            border-radius: 24px;
            width: 100%;
            padding: 30px 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .step-item {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .step-item:last-child {
            margin-bottom: 0;
        }

        .step-num {
            background-color: #0046be;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
            margin-right: 14px;
            flex-shrink: 0;
        }

        .step-text {
            color: #111827;
            font-weight: 700;
            font-size: 17px;
            line-height: 1.2;
        }

        .must-label {
            background-color: #facc15;
            color: black;
            font-size: 10px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .claim-btn {
            background-color: #005fad;
            color: white;
            width: 100%;
            padding: 18px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(0, 95, 173, 0.2);
            text-transform: uppercase;
        }

        .claim-btn:active {
            transform: scale(0.98);
            background-color: #004a87;
        }

        .claimed-info {
            margin-top: 16px;
            color: #005fad;
            font-weight: 700;
            font-size: 12px;
            display: flex;
            align-items: center;
        }

        .footer-text {
            margin-top: 30px;
            color: #9ca3af;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.05em;
            padding: 0 20px;
        }

        .links {
            margin: 20px 0 40px;
            display: flex;
            gap: 16px;
            color: #9ca3af;
            font-size: 10px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <!-- Header Logo -->
    <div class="header-logo">
        <div class="bestbuy-brand">
            <span class="bb-blue">BEST BUY</span>
            <span class="bb-tag">REWARDS</span>
        </div>
    </div>

    <!-- Content Container -->
    <div class="main-container">
        
        <div class="price-text">$1,000</div>
        <div class="sub-heading">Best Buy Gift Card</div>

        <!-- Badge -->
        <div class="active-badge">
            <div class="pulse-dot"></div>
            Active Promotion Available
        </div>

        <!-- Mobile-First Instruction Card -->
        <div class="instruction-box">
            <div class="step-item">
                <div class="step-num">1</div>
                <div class="step-text">Click The Button Below</div>
            </div>
            <div class="step-item">
                <div class="step-num">2</div>
                <div class="step-text">Enter Your Basic Info</div>
            </div>
            <div class="step-item">
                <div class="step-num">3</div>
                <div class="step-text">Complete 3 to 5 Deals <span class="must-label">MUST</span></div>
            </div>
            <div class="step-item">
                <div class="step-num">4</div>
                <div class="step-text">Claim Your Reward</div>
            </div>
        </div>

        <!-- Big CTA Button -->
        <a href="https://linkthem.net/aff_c?offer_id=880&aff_id=165890" class="claim-btn">
            CLAIM YOUR GIFT CARD <span class="ml-2 text-xl">→</span>
        </a>

        <!-- Claim Stats -->
        <div class="claimed-info">
            <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7"></path>
            </svg>
            3,194 PEOPLE CLAIMED TODAY
        </div>

        <!-- Mobile Footer Details -->
        <div class="footer-text uppercase text-center">
            Limited time offer. Terms and conditions apply.
        </div>

        <div class="links uppercase">
            <a href="#" class="hover:text-gray-600">Privacy</a>
            <a href="#" class="hover:text-gray-600">Terms</a>
            <a href="#" class="hover:text-gray-600">Support</a>
        </div>
    </div>

</body>
</html>
